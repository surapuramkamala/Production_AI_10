
services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-rag-application
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      AUTH_DB_PATH: /app/storage/users.db
    volumes:
      - ./data:/app/data:ro
      - rag_vector_store:/app/vector_store
      - rag_storage:/app/storage
    depends_on:
      - db
      - redis
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: rag-api-gateway
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rag-app
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  rag_vector_store:
  rag_storage:
  postgres_data:
  redis_data:
